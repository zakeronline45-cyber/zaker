<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ذاكر | تقرير الطالب</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--b:#6f2392;--n:#351044;--line:#eadff0;--m:#766b80;--g:#168b5d;--r:#d82e47}*{box-sizing:border-box}body{margin:0;background:#f7f4f9;color:#241331;font-family:Tahoma,Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:10;background:#351044;color:#fff;padding:10px}.toolbar .in{max-width:980px;margin:auto;display:flex;justify-content:space-between;gap:8px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}.download{background:#ff7418;color:#fff}.print{background:#fff;color:#351044}.sheet{width:min(960px,94%);margin:22px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 34px #35104418}.head{border-bottom:3px solid var(--b);padding-bottom:16px}.brand{font-size:29px;font-weight:900;color:var(--n)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.kpi{background:#faf7fc;border:1px solid var(--line);border-radius:13px;padding:12px}.kpi b{display:block;font-size:24px;color:var(--n)}.block{border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0;page-break-inside:avoid}.good{border-right:4px solid var(--g)}.bad{border-right:4px solid var(--r)}.muted{color:var(--m)}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:right}@media(max-width:650px){.meta,.kpis{grid-template-columns:1fr 1fr}.sheet{padding:16px}}@media print{.toolbar{display:none}.sheet{box-shadow:none;margin:0;width:100%;border-radius:0}}
</style></head><body><div class="toolbar"><div class="in"><b>تقرير متابعة الطالب — ذاكر</b><div><button class="btn print" onclick="window.print()">طباعة</button> <button class="btn download" onclick="downloadPdf()">تنزيل PDF</button></div></div></div><main id="report" class="sheet"><div class="muted">جاري تحميل التقرير...</div></main>
<script>
const SUPABASE_URL='https://llhmkyighydokneqwrdj.supabase.co',SUPABASE_KEY='sb_publishable_bGxbtk2yxjDaFACjEGrBWA_1MBC1i77',sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let payload=null;
async function load(){const token=new URLSearchParams(location.search).get('token');if(!token){report.innerHTML='<h2>الرابط غير صالح</h2>';return}const {data,error}=await sb.rpc('get_shared_student_report',{p_token:token});if(error||!data){report.innerHTML='<h2>الرابط منتهي أو تم إلغاؤه</h2><p class="muted">اطلب رابطًا جديدًا من إدارة منصة ذاكر.</p>';return}payload=data;render()}
function render(){const st=payload.student||{},d=payload.dashboard||{},tests=d.tests||[],answers=tests.flatMap(x=>x.answers||[]),wrong=answers.filter(x=>!x.correct),avg=tests.length?Math.round(tests.reduce((a,x)=>a+Number(x.pct||0),0)/tests.length):0,best=tests.length?Math.max(...tests.map(x=>Number(x.pct||0))):0;const weak={};wrong.forEach(x=>weak[x.lessonTitle||x.lesson_title||'Science']=(weak[x.lessonTitle||x.lesson_title||'Science']||0)+1);const weakRows=Object.entries(weak).sort((a,b)=>b[1]-a[1]);const latestPlan=tests.find(x=>x.feedback?.plan?.length)?.feedback?.plan||[];report.innerHTML=`
<div class="head"><div class="brand">🎓 ذاكر — تقرير متابعة تعليمي</div><div class="meta"><div><b>الطالب:</b> ${esc(st.full_name)}</div><div><b>الصف:</b> ${esc(({prep1:'أولى إعدادي',prep2:'تانية إعدادي',prep3:'تالتة إعدادي'}[st.grade]||st.grade))}</div><div><b>المسار:</b> ${st.track==='languages'?'لغات':'عربي'}</div><div><b>ولي الأمر:</b> ${esc(st.guardian_name||'—')}</div><div><b>تاريخ التقرير:</b> ${new Date(payload.generated_at).toLocaleString('ar-EG')}</div><div><b>المادة الحالية:</b> Science</div></div></div>
<div class="kpis"><div class="kpi"><span>الاختبارات</span><b>${tests.length}</b></div><div class="kpi"><span>متوسط الأداء</span><b>${tests.length?avg+'%':'—'}</b></div><div class="kpi"><span>أفضل نتيجة</span><b>${tests.length?best+'%':'—'}</b></div><div class="kpi"><span>أخطاء للمراجعة</span><b>${wrong.length}</b></div></div>
<h2>نتائج الاختبارات</h2>${tests.length?'<table><thead><tr><th>الاختبار</th><th>النتيجة</th><th>التاريخ</th></tr></thead><tbody>'+tests.slice(0,20).map(x=>'<tr><td>'+esc(x.lesson_title||x.subject)+'</td><td><b>'+x.pct+'%</b></td><td>'+new Date(x.created_at).toLocaleDateString('ar-EG')+'</td></tr>').join('')+'</tbody></table>':'<div class="block muted">لا توجد اختبارات بعد.</div>'}
<h2>نقاط القوة والضعف</h2><div class="block good"><b>ملخص الأداء</b><p>${tests.length?(avg>=80?'أداء قوي ومستقر في الاختبارات المسجلة.':avg>=60?'الأداء متوسط ويحتاج متابعة مركزة في الأخطاء المتكررة.':'يحتاج الطالب إلى خطة مراجعة منتظمة وإعادة التدريب على المفاهيم الأساسية.'):'لا توجد بيانات كافية للحكم على الأداء بعد.'}</p></div>
${weakRows.length?weakRows.slice(0,8).map(x=>'<div class="block bad"><b>'+esc(x[0])+'</b><div>'+x[1]+' أخطاء مسجلة تحتاج مراجعة.</div></div>').join(''):'<div class="block good">لا توجد أخطاء مسجلة في الاختبارات المحفوظة.</div>'}
<h2>التوصيات وخطة المراجعة</h2><div class="block">${latestPlan.length?'<ol>'+latestPlan.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'<ol><li>مراجعة الدروس التي ظهرت بها أخطاء.</li><li>إعادة الاختبار بعد المراجعة وقياس التحسن.</li><li>الاستمرار على اختبار قصير بعد كل درس.</li></ol>'}</div>
<h2>آخر الإجابات التي تحتاج مراجعة</h2>${wrong.length?wrong.slice(0,12).map((a,i)=>'<div class="block bad"><b>سؤال '+(i+1)+'</b><p style="direction:ltr;text-align:left">'+esc(a.question||'')+'</p><div><b>إجابة الطالب:</b> '+esc(a.studentAnswer||'—')+'</div><div><b>الإجابة الصحيحة:</b> '+esc(a.correctAnswer||'—')+'</div></div>').join(''):'<div class="block good">لا توجد إجابات خاطئة مسجلة.</div>'}
<div class="muted" style="margin-top:24px;border-top:1px solid var(--line);padding-top:12px">هذا التقرير تم إنشاؤه من بيانات منصة ذاكر وقت إصدار الرابط.</div>`}
}
function downloadPdf(){const name=(payload?.student?.full_name||'student-report').replace(/\s+/g,'-');html2pdf().set({margin:8,filename:'Zaker-'+name+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(report).save()}
load();
</script></body></html>
