<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ذاكر | طلبات حذف البيانات</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--p:#6f2392;--bg:#f8f6fa;--line:#eadff0;--m:#766b80;--r:#c82f43}*{box-sizing:border-box}body{visibility:hidden;margin:0;font-family:Tahoma,Arial;background:var(--bg);color:#26162f}header{background:#fff;border-bottom:1px solid var(--line);padding:14px}.wrap{max-width:1100px;margin:auto;padding:0 16px}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--p);color:#fff}.soft{background:#f2e8f7;color:var(--p)}.muted{color:var(--m)}.req{border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f2e8f7;color:var(--p);font-weight:900;font-size:12px}input,select{padding:9px;border:1px solid var(--line);border-radius:9px;font:inherit}
</style></head><body><header><div class="wrap bar"><b>🎓 طلبات حذف الحساب والبيانات</b><div><a class="btn soft" href="/admin-control.html">مركز التحكم</a> <a class="btn soft" href="/admin.html">الإدارة</a></div></div></header><main class="wrap"><div class="card"><h2>طلبات الخصوصية</h2><p class="muted">هذه الشاشة لا تحذف البيانات تلقائيًا. استخدمها لمراجعة الطلب وتوثيق حالته قبل تنفيذ الحذف النهائي وفق السجلات المطلوب الاحتفاظ بها.</p><button class="btn primary" onclick="load()">تحديث</button></div><div id="list" class="card">جاري التحميل...</div></main><script>
const sb=supabase.createClient('https://llhmkyighydokneqwrdj.supabase.co','sb_publishable_bGxbtk2yxjDaFACjEGrBWA_1MBC1i77');
async function requireAdminMFA(nextPath){
 const {data,error}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
 if(!error&&data?.nextLevel==='aal2'&&data?.currentLevel!=='aal2'){location.href='/admin-security.html?next='+encodeURIComponent(nextPath||location.pathname+location.search);return false}
 return true;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let isSuper=false;
async function guard(){const {data:ss}=await sb.auth.getSession();if(!ss.session){location.href='/login.html?next=/admin-deletions.html';return false}if(!(await requireAdminMFA('/admin-deletions.html')))return false;const {data:ok}=await sb.rpc('is_admin');if(!ok){location.href='/';return false}const {data:su}=await sb.rpc('is_super_admin');isSuper=su===true;document.body.style.visibility='visible';return true}
async function load(){list.textContent='جاري التحميل...';const {data,error}=await sb.rpc('admin_list_data_deletion_requests');if(error){list.textContent=error.message;return}if(!data?.length){list.innerHTML='<div class="muted">لا توجد طلبات حذف حاليًا.</div>';return}list.innerHTML=data.map(r=>'<div class="req"><div class="bar"><div><b>'+esc(r.guardian_name||r.email||'حساب')+'</b><div class="muted">'+esc(r.email||'')+(r.phone?' — '+esc(r.phone):'')+'</div></div><span class="pill">'+esc(r.status)+'</span></div><p><b>تاريخ الطلب:</b> '+new Date(r.requested_at).toLocaleString('ar-EG')+'</p>'+(r.reason?'<p><b>السبب:</b> '+esc(r.reason)+'</p>':'')+(r.admin_note?'<p><b>ملاحظة الإدارة:</b> '+esc(r.admin_note)+'</p>':'')+(isSuper?'<div class="bar" style="justify-content:flex-start"><select id="s-'+r.id+'"><option value="pending">pending</option><option value="processing">processing</option><option value="rejected">rejected</option><option value="cancelled">cancelled</option></select><input id="n-'+r.id+'" placeholder="ملاحظة الإدارة"><button class="btn primary" onclick="save(\''+r.id+'\')">حفظ الحالة</button></div>':'')+'</div>').join('');for(const r of data){const e=document.getElementById('s-'+r.id);if(e)e.value=r.status}}
async function save(id){const status=document.getElementById('s-'+id).value,note=document.getElementById('n-'+id).value.trim();const {error}=await sb.rpc('admin_set_data_deletion_request_status',{p_id:id,p_status:status,p_admin_note:note});if(error){alert(error.message);return}load()}
(async()=>{if(await guard())load()})();
</script></body></html>
