<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ذاكر | ملفات الطلاب</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--b:#6f2392;--n:#351044;--bg:#f8f6fa;--line:#eadff0;--m:#766b80;--g:#168b5d;--r:#d82e47}
*{box-sizing:border-box}body{visibility:hidden;margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#241331}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.top{background:linear-gradient(135deg,#351044,#742499);color:#fff;position:sticky;top:0;z-index:20}.wrap{max-width:1200px;margin:auto}.bar{min-height:76px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:26px;font-weight:900}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer}.soft{background:#ffffff18;color:#fff;border:1px solid #ffffff40}.primary{background:var(--b);color:#fff}.ghost{background:#f2e7f7;color:var(--b)}.danger{background:#fff0f1;color:var(--r)}
main{max-width:1200px;margin:24px auto;padding:0 16px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 26px rgba(63,20,92,.07)}.search{display:grid;grid-template-columns:1fr auto;gap:10px}.search input{padding:13px;border:1px solid var(--line);border-radius:12px}.muted{color:var(--m)}.students{display:grid;gap:12px;margin-top:16px}.student{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:15px}.student h3{margin:0 0 5px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#f2e7f7;color:var(--b);font-size:12px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap}.drawer{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:14px;grid-column:1/-1}.drawer.open{display:block}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi{background:#faf7fc;border-radius:13px;padding:12px}.kpi b{display:block;font-size:22px;color:var(--n)}.report{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.ok{color:var(--g)}@media(max-width:760px){.student{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.search{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column;padding:14px 18px}}
</style><link rel="stylesheet" href="/zaker-theme.css">
</head><body>
<header class="top"><div class="wrap bar"><div class="brand">🎓 ذاكر — ملفات الطلاب</div><div class="nav"><a class="btn soft" href="/admin.html">الإدارة</a><a class="btn soft" href="/?preview=1">العودة للموقع</a><button class="btn soft" onclick="logout()">خروج</button></div></div></header>
<main><section class="card"><h1 style="margin-top:0">ملفات الطلاب</h1><p class="muted">ابحث باسم الطالب أو ولي الأمر أو رقم الموبايل، ثم افتح الملف وأنشئ تقرير متابعة رسمي.</p>
<div class="search"><input id="q" placeholder="اسم الطالب / ولي الأمر / رقم الموبايل" onkeydown="if(event.key==='Enter')searchStudents()"><button class="btn primary" onclick="searchStudents()">بحث</button></div>
<div id="status" class="muted" style="margin-top:10px"></div><div id="students" class="students"></div></section></main>
<script>
const SUPABASE_URL='https://llhmkyighydokneqwrdj.supabase.co',SUPABASE_KEY='sb_publishable_bGxbtk2yxjDaFACjEGrBWA_1MBC1i77',sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function requireAdminMFA(nextPath){
 const {data,error}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
 if(!error&&data?.nextLevel==='aal2'&&data?.currentLevel!=='aal2'){location.href='/admin-security.html?next='+encodeURIComponent(nextPath||location.pathname+location.search);return false}
 return true;
}
let session=null,rows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const grade=x=>({p4:'رابعة ابتدائي',p5:'خامسة ابتدائي',p6:'سادسة ابتدائي',prep1:'أولى إعدادي',prep2:'تانية إعدادي',prep3:'تالتة إعدادي'}[x]||x||'');
async function init(){const s=await sb.auth.getSession();session=s.data.session;if(!session){location.href='/login.html?next=/admin-students.html';return}if(!(await requireAdminMFA('/admin-students.html')))return;const {data}=await sb.from('profiles').select('role').eq('id',session.user.id).limit(1);if(data?.[0]?.role!=='admin'){location.href='/account.html';return}document.body.style.visibility='visible';await searchStudents()}
async function searchStudents(){status.textContent='جاري البحث...';const {data,error}=await sb.rpc('admin_search_children_v2',{p_query:q.value.trim()});if(error){status.textContent=error.message;return}rows=data||[];status.textContent=rows.length+' طالب';students.innerHTML=rows.map((r,i)=>`
<div class="student"><div><h3>${esc(r.child_name)}</h3><div><span class="pill">${grade(r.grade)}</span> <span class="pill">${r.track==='languages'?'لغات':'عربي'}</span></div><div class="muted" style="margin-top:6px">ولي الأمر: ${esc(r.guardian_name||'—')} — ${esc(r.guardian_phone||r.guardian_email||'—')}</div></div>
<div class="actions"><button class="btn primary" onclick="openFile(${i})">فتح الملف</button><button class="btn ghost" onclick="createReport(${i})">إنشاء تقرير</button></div>
<div class="drawer" id="drawer-${i}"></div></div>`).join('')||'<div class="muted">لا توجد نتائج.</div>'}
async function openFile(i){const r=rows[i],d=document.getElementById('drawer-'+i);d.classList.add('open');d.innerHTML='<div class="muted">جاري تحميل ملف الطالب...</div>';const {data,error}=await sb.rpc('get_child_dashboard',{p_child_id:r.child_id});if(error){d.innerHTML=esc(error.message);return}const tests=data?.tests||[],all=tests.flatMap(x=>x.answers||[]),wrong=all.filter(x=>!x.correct),avg=tests.length?Math.round(tests.reduce((a,x)=>a+Number(x.pct||0),0)/tests.length):0;d.innerHTML=`<div class="kpis"><div class="kpi"><span>الاختبارات</span><b>${tests.length}</b></div><div class="kpi"><span>المتوسط</span><b>${tests.length?avg+'%':'—'}</b></div><div class="kpi"><span>الدروس</span><b>${(data?.lessons||[]).length}</b></div><div class="kpi"><span>أخطاء للمراجعة</span><b>${wrong.length}</b></div></div><div style="margin-top:12px"><button class="btn primary" onclick="createReport(${i})">إنشاء تقرير PDF / رابط آمن</button> <button class="btn ghost" onclick="loadHistory(${i})">التقارير السابقة</button></div><div id="history-${i}"></div>`}
async function createReport(i){const r=rows[i];const {data,error}=await sb.rpc('admin_create_student_report',{p_child_id:r.child_id,p_days:7});if(error){alert(error.message);return}const x=data?.[0];if(!x)return;const url=location.origin+'/student-report.html?token='+encodeURIComponent(x.token);window.open(url,'_blank');setTimeout(()=>{shareWhatsApp(i,url)},250)}
function normalizedPhone(p){let x=String(p||'').replace(/\D/g,'');if(x.startsWith('0'))x='20'+x.slice(1);if(x && !x.startsWith('20'))x='20'+x;return x}
function shareWhatsApp(i,url){const r=rows[i],phone=normalizedPhone(r.guardian_phone);if(!phone)return;const msg='تقرير متابعة '+r.child_name+' من منصة ذاكر: '+url+'\nالرابط مؤقت وآمن.';if(confirm('تم إنشاء التقرير. هل تريد فتح واتساب لإرساله لولي الأمر؟'))window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank')}
async function loadHistory(i){const r=rows[i],box=document.getElementById('history-'+i);box.innerHTML='<div class="muted">جاري التحميل...</div>';const {data,error}=await sb.rpc('admin_list_student_reports',{p_child_id:r.child_id});if(error){box.textContent=error.message;return}box.innerHTML=(data||[]).map(x=>{const active=!x.revoked_at&&new Date(x.expires_at)>new Date();const url=location.origin+'/student-report.html?token='+x.token;return '<div class="report"><div><b>'+new Date(x.created_at).toLocaleString('ar-EG')+'</b><div class="muted">'+(active?'صالح حتى '+new Date(x.expires_at).toLocaleString('ar-EG'):'منتهي / ملغي')+'</div></div><div class="actions">'+(active?'<button class="btn ghost" onclick="window.open(\''+url+'\',\'_blank\')">فتح</button><button class="btn danger" onclick="revokeReport(\''+x.id+'\','+i+')">إلغاء الرابط</button>':'')+'</div></div>'}).join('')||'<div class="muted">لا توجد تقارير سابقة.</div>'}
async function revokeReport(id,i){if(!confirm('إلغاء هذا الرابط؟'))return;const {error}=await sb.rpc('admin_revoke_student_report',{p_report_id:id});if(error){alert(error.message);return}loadHistory(i)}
async function logout(){await sb.auth.signOut();location.href='/login.html'}
init();
</script></body></html>
