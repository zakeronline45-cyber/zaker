<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ذاكر | مراجعة ليلة الامتحان</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/zaker-i18n.js"></script><style>:root{--p:#5b2b82;--o:#ff7418;--line:#eadff0;--bg:#f8f6fa;--m:#766b80;--g:#15966c}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:var(--bg);color:#241331}header{background:linear-gradient(135deg,#351044,#742499);color:#fff;padding:16px}.wrap{max-width:1000px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}a{color:inherit;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.review{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.price{font-size:25px;font-weight:900;color:var(--p)}button,select,input{font:inherit;border-radius:10px;padding:10px}.btn{border:0;background:var(--o);color:#fff;font-weight:900;cursor:pointer}.soft{background:#f2e7f7;color:var(--p)}.muted{color:var(--m)}.ok{color:var(--g);font-weight:900}.bank{display:none}.bank.show{display:block}label{display:grid;gap:6px;margin:9px 0}input,select{border:1px solid var(--line);background:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap bar"><b>🎓 مراجعة ليلة الامتحان</b><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><a href="/">الرئيسية</a> · <a href="/account.html">حسابي</a> · <a href="/contact.html">تواصل معنا</a><select id="zakerLangSwitch" class="soft" onchange="setZakerLanguage(this.value)" aria-label="Language"><option value="en">EN</option><option value="ar">AR</option></select></div></div></header><main class="wrap"><div class="card"><h1>مراجعة ليلة الامتحان</h1><p class="muted">المراجعة منتج مستقل، ولا تظهر هنا إلا عندما تقوم الإدارة بفتحها. السعر الافتراضي 100 جنيه للمادة.</p><label>الطالب <select id="child"></select></label><div id="term" class="muted"></div></div><div id="list" class="grid"></div><div id="bankBox" class="card bank"><h2>إتمام طلب مراجعة ليلة الامتحان</h2><div id="bankDetails"></div><p><b>كود الطلب:</b> <span id="refCode"></span></p><p><b>المبلغ:</b> <span id="amountDue"></span> جنيه</p><label>اسم المحوّل<input id="senderName"></label><label>مرجع التحويل<input id="transferReference"></label><label>صورة الإيصال أو PDF<input id="proofFile" type="file" accept="image/*,.pdf"></label><button class="btn" onclick="submitProof()">إرسال التحويل للمراجعة</button><p id="proofMsg"></p></div></main><script>
const sb=supabase.createClient('https://llhmkyighydokneqwrdj.supabase.co','sb_publishable_bGxbtk2yxjDaFACjEGrBWA_1MBC1i77');let children=[],session=null,pendingPayment=null;
function ref(){return 'ZKR-'+Date.now().toString(36).slice(-6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
async function init(){const {data:s}=await sb.auth.getSession();session=s.session;if(!session){location.href='/login.html?next=/exam-review.html';return}const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(p?.role==='admin'){location.href='/admin-control.html';return}const {data:c}=await sb.from('children').select('id,full_name,grade,track').eq('guardian_user_id',session.user.id).eq('is_active',true).order('created_at');children=c||[];child.innerHTML=children.map(x=>'<option value="'+x.id+'">'+x.full_name+'</option>').join('');const saved=localStorage.getItem('zaker_active_child_id');if(saved&&children.some(x=>x.id===saved))child.value=saved;child.onchange=()=>{localStorage.setItem('zaker_active_child_id',child.value);bankBox.classList.remove('show');load()};const {data:set}=await sb.rpc('get_platform_settings');term.textContent=(Number(set?.active_term)===2?window.zakerT('الترم الثاني','Term 2'):window.zakerT('الترم الأول','Term 1'))+' — '+(set?.active_academic_year||'');await loadBank();load()}
async function loadBank(){const {data}=await sb.from('bank_transfer_settings').select('*').eq('id',1).maybeSingle();const x=data||{};bankDetails.innerHTML='<div><b>اسم الحساب:</b> '+(x.account_name||'—')+'</div><div><b>البنك:</b> '+(x.bank_name||'—')+'</div>'+(x.account_number?'<div><b>رقم الحساب:</b> '+x.account_number+'</div>':'')+(x.iban?'<div><b>IBAN:</b> '+x.iban+'</div>':'')+(x.instructions?'<p>'+x.instructions+'</p>':'')}
async function load(){if(!child.value){list.innerHTML='<div class="card">'+window.zakerT('لا يوجد طالب.','No student found.')+'</div>';return}const {data,error}=await sb.rpc('get_available_exam_reviews',{p_child_id:child.value});if(error){list.innerHTML='<div class="card">'+error.message+'</div>';return}if(!data?.length){list.innerHTML='<div class="card"><b>'+window.zakerT('لا توجد مراجعات مفتوحة الآن.','No reviews are open right now.')+'</b><p class="muted">'+window.zakerT('ستظهر المراجعة فقط بعد تفعيل الإدارة لها.','Reviews will appear after the administration enables them.')+'</p></div>';return}list.innerHTML=data.map(x=>'<div class="review"><h3>'+x.subject_code+'</h3><div class="price">'+x.price_egp+' '+window.zakerT('جنيه','EGP')+'</div><p class="muted">'+(x.status==='active'?window.zakerT('✅ تم التفعيل.','✅ Activated.'):x.status==='pending'?window.zakerT('⏳ التحويل قيد المراجعة.','⏳ Transfer under review.'):window.zakerT('متاحة للشراء الآن.','Available to purchase now.'))+'</p>'+(x.status==='active'?'<button class="btn" onclick="openSubject(\''+String(x.subject_code).replace(/'/g,"\\'")+'\')">'+window.zakerT('فتح المراجعة','Open Review')+'</button>':x.status==='pending'?'':'<button class="btn" onclick="requestReview(\''+x.product_id+'\')">'+window.zakerT('شراء المراجعة','Purchase Review')+'</button>')+'</div>').join('')}
async function requestReview(id){const reference=ref();const {data,error}=await sb.rpc('create_exam_review_bank_transfer',{p_child_id:child.value,p_product_id:id,p_reference_code:reference});if(error){alert(error.message);return}pendingPayment={id:data.payment_id,access_id:data.access_id};refCode.textContent=data.reference_code;amountDue.textContent=data.amount;bankBox.classList.add('show');bankBox.scrollIntoView({behavior:'smooth'})}
async function submitProof(){if(!pendingPayment){alert('ابدأ طلب المراجعة أولًا');return}const file=proofFile.files[0],name=senderName.value.trim(),tr=transferReference.value.trim();if(!file||!name||!tr){alert('أكمل بيانات التحويل وارفع الإيصال');return}const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=session.user.id+'/review-'+pendingPayment.id+'.'+ext;const up=await sb.storage.from('bank-transfer-proofs').upload(path,file,{upsert:true});if(up.error){alert(up.error.message);return}const {error}=await sb.rpc('submit_bank_transfer_proof',{p_payment_id:pendingPayment.id,p_sender_name:name,p_transfer_reference:tr,p_proof_path:path});if(error){proofMsg.textContent=error.message;return}proofMsg.innerHTML='<span class="ok">تم إرسال التحويل للمراجعة.</span> ستفتح المراجعة بعد اعتماد الإدارة.';pendingPayment=null;load()}
function openSubject(s){const ch=children.find(x=>x.id===child.value)||{},n=String(s).toLowerCase();if(ch.grade==='p4'){let k=n.includes('math')?'math':n.includes('science')?'science':n.includes('english')?'english':(n.includes('arab')||n.includes('العربي'))?'arabic':'studies';if(ch.track==='arabic'&&k==='math')k='math-ar';if(ch.track==='arabic'&&k==='science')k='science-ar';location.href='/primary4.html?subject='+k+'&review=1';return}let u='/';if(n.includes('science')||n==='العلوم')u='/student.html?review=1';else if(n.includes('math')||n==='الرياضيات')u=n==='الرياضيات'?'/math-ar.html?review=1':'/math.html?review=1';else if(n.includes('english'))u='/english.html?review=1';else if(n.includes('arab')||n.includes('العربي'))u='/arabic.html?review=1';else if(n.includes('دراسات')||n.includes('studies'))u='/social-studies.html?review=1';location.href=u}
init();
</script><script src="/zaker-platform.js"></script></body></html>
