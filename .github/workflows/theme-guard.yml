name: Zaker Theme Guard

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.html"
      - "zaker-theme.css"
      - ".github/workflows/theme-guard.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "zaker-theme.css"

permissions:
  contents: read

jobs:
  verify-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every HTML page uses the shared theme
        shell: bash
        run: |
          missing=0
          while IFS= read -r -d '' file; do
            if ! grep -q '/zaker-theme.css' "$file"; then
              echo "::error file=$file::Missing /zaker-theme.css"
              missing=1
            fi
          done < <(find . -type f -name '*.html' -print0)
          exit "$missing"
