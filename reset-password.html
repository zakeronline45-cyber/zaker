<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ذاكر | كلمة مرور جديدة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Tahoma,Arial;background:#f8f6fa;color:#241331;display:grid;place-items:center;min-height:100vh}.card{width:min(520px,92%);background:#fff;border:1px solid #eadff0;border-radius:22px;padding:28px;box-shadow:0 16px 45px #35104422}input,button{font:inherit;width:100%;padding:13px;border-radius:11px;margin-top:10px}input{border:1px solid #eadff0}button{border:0;background:#6f2392;color:#fff;font-weight:900}</style><link rel="stylesheet" href="/zaker-theme.css">
</head><body><div class="card"><h1>تعيين كلمة مرور جديدة</h1><p>اكتب كلمة مرور جديدة لا تقل عن 6 أحرف.</p><input id="p1" type="password" minlength="6" placeholder="كلمة المرور الجديدة"><input id="p2" type="password" minlength="6" placeholder="تأكيد كلمة المرور"><button onclick="save()">حفظ كلمة المرور</button><p id="msg"></p></div><script>
const sb=supabase.createClient('https://llhmkyighydokneqwrdj.supabase.co','sb_publishable_bGxbtk2yxjDaFACjEGrBWA_1MBC1i77');
async function save(){msg.textContent='';if(p1.value.length<6||p1.value!==p2.value){msg.textContent='تأكد من كلمة المرور وتطابقها.';return}const {error}=await sb.auth.updateUser({password:p1.value});if(error){msg.textContent=error.message;return}msg.textContent='تم تغيير كلمة المرور بنجاح.';setTimeout(()=>location.href='/',900)}
</script></body></html>
