<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ذاكر | معاينة الإدارة</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#165DFF;--bg:#f5f8ff;--line:#e4eaf5;--m:#71809a}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:var(--bg);color:#1d2b48}header{background:#fff;border-bottom:1px solid var(--line);padding:14px}.wrap{max-width:1180px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:6px}.field select{padding:11px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer;background:var(--b);color:#fff}a{text-decoration:none;color:inherit}.lesson{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}.muted{color:var(--m)}.q{background:#f8faff;border-radius:10px;padding:9px;margin:5px 0}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header><div class="wrap bar"><b>🎓 معاينة الإدارة — بدون ملف طالب</b><div><a href="/admin.html">إدارة المحتوى</a> · <a href="/admin-control.html">مركز التحكم</a></div></div></header><main class="wrap"><div class="card"><div class="row"><label class="field">الصف<select id="grade"><option value="p4">رابعة ابتدائي</option><option value="prep1">أولى إعدادي</option><option value="p5">خامسة ابتدائي</option><option value="p6">سادسة ابتدائي</option><option value="prep2">ثانية إعدادي</option><option value="prep3">ثالثة إعدادي</option></select></label><label class="field">المسار<select id="track"><option value="languages">لغات</option><option value="arabic">عربي</option></select></label><label class="field">المادة<select id="subject"></select></label></div><button class="btn" style="margin-top:10px" onclick="loadContent()">فتح المحتوى</button></div><div id="status" class="card"></div><div id="content"></div></main><script>
const sb=supabase.createClient('https://llhmkyighydokneqwrdj.supabase.co','sb_publishable_bGxbtk2yxjDaFACjEGrBWA_1MBC1i77');
const qp=new URLSearchParams(location.search),g0=qp.get('grade')||'p4',t0=qp.get('track')||'languages',s0=qp.get('subject')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function subjects(g,t){if(g==='p4')return t==='arabic'?['العلوم','الرياضيات','English','Arabic','الدراسات الاجتماعية']:['Science','Math','English','Arabic','الدراسات الاجتماعية'];if(g==='prep1')return t==='arabic'?['الرياضيات','Arabic','الدراسات الاجتماعية']:['Science','Math','English','Arabic','الدراسات الاجتماعية'];return []}
function refresh(){const a=subjects(grade.value,track.value);subject.innerHTML=a.map(x=>'<option value="'+x+'">'+(x==='Arabic'?'اللغة العربية':x)+'</option>').join('')||'<option value="">لا يوجد محتوى مرفوع</option>';if(a.includes(s0))subject.value=s0}
function fileFor(g,t,s){if(g==='p4'){if(s==='Science')return '/content/p4-science-term1.json';if(s==='العلوم')return '/content/p4-science-ar-term1.json';if(s==='Math')return '/content/p4-math-term1.json';if(s==='الرياضيات')return '/content/p4-math-ar-term1.json';if(s==='English')return '/content/p4-english-term1.json';if(s==='Arabic')return '/content/p4-arabic-term1.json';if(s==='الدراسات الاجتماعية')return '/content/p4-social-studies-term1.json'}if(g==='prep1'){if(s==='Math')return '/content/math-term1.json';if(s==='الرياضيات')return '/content/math-ar-term1.json';if(s==='English')return '/content/english-term1.json';if(s==='Arabic')return '/content/arabic-term1.json';if(s==='الدراسات الاجتماعية')return '/content/social-studies-term1.json'}return ''}
async function loadContent(){const g=grade.value,t=track.value,s=subject.value;if(!s){status.textContent='لا يوجد محتوى مرفوع لهذا الصف حاليًا.';content.innerHTML='';return}history.replaceState(null,'','/admin-preview.html?grade='+g+'&track='+t+'&subject='+encodeURIComponent(s));status.innerHTML='<b>'+grade.options[grade.selectedIndex].text+' — '+track.options[track.selectedIndex].text+' — '+(s==='Arabic'?'اللغة العربية':esc(s))+'</b><div class="muted">حساب الإدارة يرى كل المحتوى بدون اشتراك وبدون اسم طالب.</div>';if(g==='prep1'&&s==='Science'){const titles=['Structure of the Atom','The Periodic Table of Elements','Matter and Its Properties','Chemical Bonds','Electric Forces','Magnetic Forces','Gravitational Forces','Cells and Life','General Characteristics of Living Organisms','Microbes','The Earth and the Solar System','Lunar Eclipse'];content.innerHTML='<div class="card"><h2>Science — First Prep</h2>'+titles.map((x,i)=>'<div class="lesson"><b>Lesson '+(i+1)+': '+x+'</b><div class="muted">المحتوى متاح لحساب الإدارة.</div></div>').join('')+'</div>';return}const f=fileFor(g,t,s);if(!f){content.innerHTML='<div class="card">لا يوجد ملف محتوى لهذا الاختيار حتى الآن.</div>';return}try{const r=await fetch(f,{cache:'no-store'});const d=await r.json();const mods=d.modules||[];content.innerHTML='<div class="card"><h2>'+esc(d.subject||s)+'</h2><p class="muted">'+mods.length+' وحدة/درس — '+mods.reduce((n,m)=>n+(m.questions?.length||0),0)+' سؤال</p>'+mods.map(m=>'<details class="lesson"><summary><b>'+esc(m.title)+'</b> — '+(m.questions?.length||0)+' سؤال</summary>'+(m.summary?'<p>'+esc(m.summary)+'</p>':'')+(m.questions||[]).slice(0,10).map(q=>'<div class="q">'+esc(q.text||q.question||'')+'</div>').join('')+'</details>').join('')+'</div>'}catch(e){content.innerHTML='<div class="card">تعذر تحميل المحتوى: '+esc(e.message)+'</div>'}}
(async()=>{const {data:ss}=await sb.auth.getSession();if(!ss.session){location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);return}const {data:ok}=await sb.rpc('is_admin');if(!ok){location.href='/';return}grade.value=g0;track.value=t0;refresh();grade.onchange=refresh;track.onchange=refresh;try{await sb.rpc('log_app_event',{p_event_type:'admin_preview',p_page:location.pathname+location.search,p_child_id:null,p_details:{grade:g0,track:t0,subject:s0}})}catch(e){}loadContent()})();
</script></body></html>
